name: Prevent committed secrets

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - security/required-secret-gate-20261024
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify complete Git checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
      - name: Scan committed source and history with redacted Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/gitleaks:/results" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --no-banner --redact=100 --log-level error \
            --report-format json --report-path /results/report.json \
            >"$RUNNER_TEMP/gitleaks/private.log" 2>&1
          code=$?
          set -e
          SCAN_CODE="$code" python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          code=int(os.environ["SCAN_CODE"])
          report=Path(os.environ["RUNNER_TEMP"])/"gitleaks"/"report.json"
          if code not in (0,1):
              print("::error title=Secret scanning incomplete::Scanner execution failed; no clean result can be claimed.")
              sys.exit(2)
          try:
              matches=json.loads(report.read_text(encoding="utf-8")) if report.exists() else []
              if matches is None:
                  matches=[]
              if not isinstance(matches,list):
                  raise ValueError("Unexpected report structure")
          except Exception:
              print("::error title=Secret scanning incomplete::Scanner report cannot be verified.")
              sys.exit(2)
          if code==1 or matches:
              print("::error title=Possible committed credential::Investigate findings privately; do not publish scanner output. Rotate any live credentials.")
              sys.exit(1)
          print("PASS: No Gitleaks v8.30.1 matches in scanned Git history under current rules.")
          PY
